[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-mlx-llm"
version = "0.1.0"
description = "Spark2_5 inference support for MLX LM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mlx-lm>=0.31.3,<0.32",
    "spark-mlx-ext==0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
]

[project.optional-dependencies]
cuda12 = ["mlx[cuda12]>=0.32.1"]
cuda13 = ["mlx[cuda13]>=0.32.1"]

[project.scripts]
spark-mlx-generate = "spark_mlx_llm.commands.generate:main"
spark-mlx-convert = "spark_mlx_llm.commands.convert:main"
spark-mlx-chat = "spark_mlx_llm.commands.chat:main"
spark-mlx-server = "spark_mlx_llm.commands.server:main"

[tool.uv.sources]
spark-mlx-ext = { path = "extensions/spark-mlx-ext", editable = true }

[tool.setuptools.packages.find]
include = ["spark_mlx_llm*"]

[tool.ruff]
line-length = 88
target-version = "py310"
