[build-system]
requires = [
    "setuptools>=80",
    "wheel",
    "cmake>=3.25",
    "nanobind==3.1.0",
    "mlx==0.32.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-spark-ext"
version = "0.2.0"
description = "Spark QKV, RoPE, and W8A8 INT8 TensorOps extension for MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.11"
dependencies = ["mlx==0.32.4"]

[tool.setuptools]
packages = ["mlx_spark_ext"]

[tool.setuptools.package-data]
mlx_spark_ext = ["*.pyi", "py.typed", "*.metallib"]
